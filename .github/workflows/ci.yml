name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git base-devel rust cargo fontconfig
      - uses: actions/checkout@v5
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: |
          VERSION="${{ steps.version.outputs.value }}"
          NAME="tachyon-fetch-${VERSION}-arch-x86_64"
          mkdir -p "dist/${NAME}"
          cp target/release/tachyon "dist/${NAME}/"
          cp LICENSE "dist/${NAME}/"
          cp logos/LICENSE-fastfetch "dist/${NAME}/"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: "*.tar.gz"
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git tar gzip cargo rust gcc fontconfig
      - uses: actions/checkout@v5
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: |
          VERSION="${{ steps.version.outputs.value }}"
          NAME="tachyon-fetch-${VERSION}-fedora-x86_64"
          mkdir -p "dist/${NAME}"
          cp target/release/tachyon "dist/${NAME}/"
          cp LICENSE "dist/${NAME}/"
          cp logos/LICENSE-fastfetch "dist/${NAME}/"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: "*.tar.gz"
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl build-essential fontconfig
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: |
          VERSION="${{ steps.version.outputs.value }}"
          ARCH="$(dpkg --print-architecture)"
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/doc/tachyon-fetch deb/usr/share/licenses/tachyon-fetch
          install -m755 target/release/tachyon deb/usr/bin/tachyon
          cp LICENSE deb/usr/share/doc/tachyon-fetch/copyright
          cp logos/LICENSE-fastfetch deb/usr/share/licenses/tachyon-fetch/LICENSE-fastfetch
          printf '%s\n' \
            "Package: tachyon-fetch" \
            "Version: ${VERSION}" \
            "Architecture: ${ARCH}" \
            "Maintainer: Mohamed Salahi <264395179+mohamedsalahi@users.noreply.github.com>" \
            "Depends: fontconfig" \
            "Section: utils" \
            "Priority: optional" \
            "Description: Cockpit-grade system fetch with a configurator and distro logos" \
            > deb/DEBIAN/control
          dpkg-deb --build --root-owner-group deb "tachyon-fetch_${VERSION}_${ARCH}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: "*.deb"
          if-no-files-found: error

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: nix-build default.nix -o result
      - run: ./result/bin/tachyon --version

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev
      - run: bash -n packaging/arch/PKGBUILD packaging/gentoo/*.ebuild
      - run: rpmspec -q --qf '%{NAME} %{VERSION}\n' packaging/fedora/tachyon-fetch.spec
      - run: dpkg-parsechangelog -l packaging/debian/changelog > /dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, arch, fedora, ubuntu, nix, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
