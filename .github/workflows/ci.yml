name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git base-devel rust cargo fontconfig sudo pacman-contrib
      - uses: actions/checkout@v5
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: |
          VERSION="${{ steps.version.outputs.value }}"
          NAME="tachyon-fetch-${VERSION}-arch-x86_64"
          mkdir -p "dist/${NAME}"
          cp target/release/tachyon "dist/${NAME}/"
          cp LICENSE "dist/${NAME}/"
          cp logos/LICENSE-fastfetch "dist/${NAME}/"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
      - name: makepkg
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r packaging/arch /tmp/archpkg
          chown -R builder:builder /tmp/archpkg
          cd /tmp/archpkg
          sudo -u builder updpkgsums
          sudo -u builder makepkg -s --noconfirm
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: |
            *.tar.gz
            *.pkg.tar.zst
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git tar gzip curl cargo rust gcc fontconfig rpm-build rust-packaging
      - uses: actions/checkout@v5
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: |
          VERSION="${{ steps.version.outputs.value }}"
          NAME="tachyon-fetch-${VERSION}-fedora-x86_64"
          mkdir -p "dist/${NAME}"
          cp target/release/tachyon "dist/${NAME}/"
          cp LICENSE "dist/${NAME}/"
          cp logos/LICENSE-fastfetch "dist/${NAME}/"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
      - name: rpmbuild
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          mkdir -p /tmp/rpmbuild/SOURCES /tmp/rpmbuild/SPECS
          curl -L --fail -o "/tmp/rpmbuild/SOURCES/tachyon-fetch-${VERSION}.tar.gz" \
            "https://github.com/mohamedsalahi/tachyon-fetch/archive/refs/tags/v${VERSION}.tar.gz"
          cp packaging/fedora/tachyon-fetch.spec /tmp/rpmbuild/SPECS/
          cp packaging/fedora/*.patch /tmp/rpmbuild/SOURCES/
          rpmbuild -ba --nodeps \
            --define "_topdir /tmp/rpmbuild" \
            --define "_sourcedir /tmp/rpmbuild/SOURCES" \
            /tmp/rpmbuild/SPECS/tachyon-fetch.spec
          cp /tmp/rpmbuild/RPMS/x86_64/*.rpm .
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: |
            "*.tar.gz"
            "*.rpm"
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl build-essential fontconfig debhelper fakeroot
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: dpkg-buildpackage
        run: |
          rm -rf /tmp/debbuild
          mkdir -p /tmp/debbuild
          tar --exclude=./target --exclude=./.git --exclude=./result -cf - . | tar -xf - -C /tmp/debbuild
          cp -r packaging/debian /tmp/debbuild/debian
          cd /tmp/debbuild
          dpkg-buildpackage -b -us -uc -d
          cp /tmp/tachyon-fetch_*.deb "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: "*.deb"
          if-no-files-found: error

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - run: nix-build default.nix -o result
      - run: ./result/bin/tachyon --version

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev
      - run: bash -n packaging/arch/PKGBUILD packaging/gentoo/*.ebuild
      - run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          grep -qx "pkgver=$VERSION" packaging/arch/PKGBUILD
          grep -Eq "^Version:[[:space:]]*$VERSION$" packaging/fedora/tachyon-fetch.spec
          grep -q "($VERSION-1)" packaging/debian/changelog
          test -f "packaging/gentoo/tachyon-fetch-$VERSION.ebuild"
      - run: python3 packaging/gentoo/gen-crates.py --check packaging/gentoo/tachyon-fetch-*.ebuild
      - run: rpmspec -q --qf '%{NAME} %{VERSION}\n' packaging/fedora/tachyon-fetch.spec
      - run: dpkg-parsechangelog -l packaging/debian/changelog > /dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, arch, fedora, ubuntu, nix, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
